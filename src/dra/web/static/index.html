<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Research Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <b>Deep Research</b>
        <small>本地研究代理</small>
      </div>
    </div>
    <button id="newBtn" class="new">＋ 新研究</button>
    <div class="sec">历史</div>
    <div id="history" class="history"></div>
    <div class="side-foot">仅监听 127.0.0.1 · 数据在本地</div>
  </aside>

  <main>
    <header class="topbar">
      <div class="title" id="viewTitle">研究</div>
      <div id="runBadge" class="badge idle">就绪</div>
    </header>

    <section class="composer">
      <textarea id="topic" rows="2" placeholder="输入研究主题，例如：2026 年主流 Agent 记忆机制方案对比"></textarea>
      <div class="controls">
        <label>来源上限
          <input id="maxSources" type="number" value="12" min="4" max="20">
        </label>
        <button id="startBtn" class="primary">开始研究</button>
      </div>
      <div class="hint" id="hint">Agent 会自动拆题、检索、交叉验证，并生成带引用的报告。</div>
    </section>

    <section class="workspace">
      <div class="flow">
        <div class="stages" id="stages"></div>
        <div class="logs-wrap">
          <div class="logs-head">事件流</div>
          <div class="logs" id="logs"></div>
        </div>
      </div>

      <div class="result">
        <div class="tabs">
          <button class="tab active" data-tab="report">报告</button>
          <button class="tab" data-tab="sources">来源</button>
          <button class="tab" data-tab="trace">轨迹</button>
        </div>
        <div id="panel" class="panel">
          <div class="empty">还没有报告。输入主题开始一次研究。</div>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
