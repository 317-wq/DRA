<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Deep Research Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">◆</div>
      <div class="brand-text">
        <b>Deep Research</b>
        <small>本地研究代理</small>
      </div>
    </div>
    <button id="newBtn" class="new">＋ 新研究</button>
    <nav class="nav">
      <button class="nav-item active" data-view="research">研究</button>
      <button class="nav-item" data-view="kb">知识库</button>
    </nav>
    <div class="sec">历史记录</div>
    <div id="history" class="history"></div>
    <div class="side-foot"><span class="live-dot"></span>仅监听 127.0.0.1 · 数据留在本机</div>
  </aside>

  <main>
    <header class="topbar">
      <div class="title-wrap">
        <div class="title" id="viewTitle">研究</div>
        <div class="subtitle">输入主题，Agent 自动拆题、检索并生成可溯源报告</div>
      </div>
      <div id="runBadge" class="badge idle">就绪</div>
    </header>

    <div id="view-research" class="view">
      <section class="composer">
        <div class="composer-head">
          <div>
            <h2>开始一次研究</h2>
            <p>支持任意主题；报告里的每条结论都会标注来源编号。</p>
          </div>
          <span class="kbd-hint">Ctrl + Enter</span>
        </div>
        <textarea id="topic" rows="2" placeholder="输入研究主题，例如：2026 年主流 Agent 记忆机制方案对比"></textarea>
        <div class="controls">
          <label>来源上限
            <input id="maxSources" type="number" value="12" min="4" max="20">
          </label>
          <button id="startBtn" class="primary">开始研究</button>
        </div>
        <div class="hint" id="hint">Agent 会自动拆题、检索、交叉验证，并生成带引用的报告。</div>
      </section>

      <section class="workspace">
        <div class="flow">
          <div class="stages" id="stages"></div>
          <div class="logs-wrap">
            <div class="logs-head">事件流</div>
            <div class="logs" id="logs"></div>
          </div>
        </div>

        <div class="result">
          <div class="tabs">
            <button class="tab active" data-tab="report">报告</button>
            <button class="tab" data-tab="sources">来源</button>
            <button class="tab" data-tab="trace">轨迹</button>
            <button class="tab" data-tab="followups">追问</button>
            <button class="tab" data-tab="quality">质量</button>
          </div>
          <div id="panel" class="panel">
            <div class="empty">还没有报告。输入主题开始一次研究。</div>
          </div>
        </div>
      </section>
    </div>

    <div id="view-kb" class="view kb-view" hidden>
      <div class="kb-toolbar">
        <input id="kbQuery" placeholder="搜索知识库，例如：换电 成本 / 向量数据库 延迟">
        <button id="kbSearchBtn" class="primary">搜索</button>
      </div>
      <div class="kb-stats" id="kbStats"></div>
      <div class="kb-results" id="kbResults"></div>
      <div class="kb-docs-head">已入库文档</div>
      <div class="kb-docs" id="kbDocs"></div>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
