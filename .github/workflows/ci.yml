name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync
      - name: 代码检查
        run: uv run ruff check src tests
      - name: 单元测试
        shell: bash
        run: |
          set +e
          uv run pytest -q --junitxml=report.xml
          code=$?
          if [ "$code" -ne 0 ]; then
            uv run python scripts/ci_report.py
          fi
          exit "$code"
      - name: 构建检查
        run: uv build
