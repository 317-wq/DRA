[project]
name = "dra"
version = "1.0.0"
description = "Deep Research Agent — 本地运行的研究报告生成工具（BYOK）"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "317-wq" }]
keywords = ["agent", "deep-research", "llm", "rag", "report", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "platformdirs>=4.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
dra = "dra.cli:app"

[project.urls]
Homepage = "https://github.com/317-wq/DRA"
Repository = "https://github.com/317-wq/DRA"
Issues = "https://github.com/317-wq/DRA/issues"
Changelog = "https://github.com/317-wq/DRA/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 需要真实网络与 API Key 的联调测试"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
